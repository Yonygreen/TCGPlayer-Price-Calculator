<!DOCTYPE html>
<html>
    <head>
        <title>Tracked Cards</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script defer src="popup.js"></script>
        <style>
            .fixed-card-width {
                width: 320px;
                min-width: 320px;
                max-width: 320px;
            }
            .centered-container {
                max-width: 100vw;
                margin-left: auto;
                margin-right: auto;
            }
            #cardList {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 1.5rem;
                justify-items: center;
            }
        </style>
    </head>
    <body class="p-3">
        <div class="container-fluid centered-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0 text-center flex-grow-1">Tracked Cards</h2>
            </div>
            <div id="cardList"></div>
            <div class="w-100 mt-3 d-flex justify-content-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <label for="import-preference" class="form-label mb-0" style="font-size: 0.875rem;">
                        Import:
                    </label>
                    <select id="import-preference" class="form-select form-select-sm" style="width: auto; min-width: 120px;">
                        <option value="lowest">Lowest Price</option>
                        <option value="bling">Bling (Highest)</option>
                    </select>
                </div>
                <button class="btn btn-primary w-auto" id="import-deck-button">
                    Import Deck from Clipboard
                </button>
                <button class="btn btn-danger w-auto" id="clear-button">
                    Reset All
                </button>
            </div>
            <div id="totalPrice" class="fw-bold mt-3 text-center w-100"></div>
            <div id="discountControls" class="mt-3 text-center w-100"></div>
        </div>
    </body>
</html>
